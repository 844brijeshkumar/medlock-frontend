<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Medlock</title>

    <style>
      /* Prevent the white flash by forcing black background on the HTML/Body immediately */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      /* Inline styles for the early loader */
      .pre-loader-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }

      .draw-line {
        stroke: #4ade80; /* Tailwind green-400 */
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: loopDraw 2.5s ease-in-out infinite;
      }

      @keyframes loopDraw {
        0% {
          stroke-dashoffset: 1;
        }
        40%,
        60% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -1;
        }
      }

      .d1 {
        animation-delay: 0s;
      }
      .d2 {
        animation-delay: 0.2s;
      }
      .d3 {
        animation-delay: 0.4s;
      }
      .d4 {
        animation-delay: 0.6s;
      }
    </style>

    <script>
      (function () {
        try {
          const config = JSON.parse(localStorage.getItem("admin-theme-config"));
          if (config) {
            const root = document.documentElement;
            root.style.setProperty("--color-bg", config.bgColor);
            root.style.setProperty("--color-primary", config.primaryColor);
            root.style.setProperty("--color-text", config.textColor);
            // If the user has a stored background color, we update the body color now
            if (config.bgColor)
              document.body.style.backgroundColor = config.bgColor;
          }
        } catch (e) {
          console.error("Theme pre-load failed", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="pre-loader-container">
        <svg viewBox="0 0 240 240" style="width: 128px; height: 128px">
          <path
            class="draw-line d1"
            pathLength="1"
            d="M 120 20 A 100 100 0 0 0 120 220"
          />
          <path
            class="draw-line d1"
            pathLength="1"
            d="M 120 20 A 100 100 0 0 1 120 220"
          />
          <rect
            class="draw-line d2"
            pathLength="1"
            x="70"
            y="104"
            width="100"
            height="75"
            rx="8"
          />
          <path
            class="draw-line d3"
            pathLength="1"
            d="M 145 104 L 145 68 A 25 25 0 0 0 95 68 L 95 85"
          />
          <path
            class="draw-line d4"
            pathLength="1"
            d="M 115 142 A 9 9 0 1 1 125 142 L 128 159 A 2 2 0 0 1 126 161 L 114 161 A 2 2 0 0 1 112 159 Z"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
